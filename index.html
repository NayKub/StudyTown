<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fdf3e7">
<meta name="color-scheme" content="light dark">
<title>My Little Town</title>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="card head">
      <h1><span data-icon="home"></span><span data-i18n="app.title"></span></h1>
      <div class="sub" data-i18n="app.tagline"></div>
    </div>

    <button class="sheetHandle" id="sheetHandle" type="button" aria-expanded="false"><i></i><span id="sheetLabel"></span></button>

    <div class="card friendPanel" id="friendPanel" hidden></div>


    <div class="card timerCard">
      <div class="presets" id="presets"></div>
      <div class="ringwrap">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="86" fill="none" style="stroke: var(--track)" stroke-width="16"/>
          <circle id="ring" cx="100" cy="100" r="86" fill="none" stroke="url(#g)" stroke-width="16" stroke-linecap="round" stroke-dasharray="540.35" stroke-dashoffset="540.35"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd36e"/><stop offset="1" stop-color="#ff8fab"/></linearGradient></defs>
        </svg>
        <div class="time"><b id="clock">25:00</b><span id="status"></span></div>
      </div>
      <div class="btns">
        <button class="btn" id="startBtn"></button>
        <button class="btn ghost" id="stopBtn"><span data-icon="stop"></span><span data-i18n="btn.stop"></span></button>
      </div>
    </div>

    <div class="card repairCard" id="repairCard" hidden>
      <div class="repairText" id="repairText"></div>
      <button class="btn small" id="repairPay"></button>
    </div>

    <div class="card next">
      <p><b class="ttl"><span data-icon="hammer"></span><span data-i18n="next.label"></span></b> <span id="nextName">-</span></p>
      <div class="bar"><i id="nextBar" style="width:0%"></i></div>
      <p class="muted" id="nextLeft">-</p>
    </div>

    <div class="card goalCard">
      <div class="goalTop">
        <div class="goalRingWrap">
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="26" fill="none" style="stroke: var(--track)" stroke-width="8"/>
            <circle id="goalRing" cx="32" cy="32" r="26" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="163.36"/>
          </svg>
          <span id="goalPct"></span>
        </div>
        <div class="goalInfo">
          <b data-i18n="goal.title"></b>
          <div id="goalText"></div>
          <small class="ttl" id="goalStreak"></small>
        </div>
      </div>
      <div class="row badgeHead">
        <b class="ttl"><span data-icon="trophy"></span><span data-i18n="ach.shelf"></span></b>
        <button class="linkbtn" id="openBadges"><span id="badgeCount"></span></button>
      </div>
      <div class="badgeRow" id="badgeRow"></div>
      <button class="btn ghost" id="replayBtn"><span data-icon="film"></span><span data-i18n="replay.button"></span></button>
    </div>

    <div class="card week">
      <div class="row">
        <b class="ttl"><span data-icon="calendar"></span><span data-i18n="week.title"></span></b>
        <button class="linkbtn" id="openLog" data-i18n="week.open"></button>
      </div>
      <div class="mini" id="mini"></div>
    </div>


    <div class="card statsCard">
      <div class="stats">
        <div class="stat"><small data-i18n="stats.total"></small><b id="sTotal"></b></div>
        <div class="stat"><small data-i18n="stats.today"></small><b id="sToday"></b></div>
        <div class="stat"><small data-i18n="stats.streak"></small><b id="sStreak"></b></div>
        <div class="stat"><small data-i18n="stats.buildings"></small><b id="sBuild"></b></div>
      </div>
      <div class="save"><span data-icon="device"></span><span data-i18n="stats.saved"></span></div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="badge" id="badge"></div>
    <div class="previewTag" id="previewTag"><span data-icon="eye"></span><span data-i18n="preview.tag"></span></div>
    <div class="stageBtns">
      <button class="round" id="accountBtn" data-i18n-label="a11y.account"></button>
      <button class="round" id="logBtn" data-i18n-label="a11y.log" data-icon="calendar"></button>
      <button class="round" id="settingsBtn" data-i18n-label="a11y.settings" data-icon="settings"></button>
      <button class="round" id="fullBtn" data-i18n-label="a11y.full" data-icon="expand"></button>
    </div>
    <div class="walletStack">
      <div class="iqChip" id="iqBadge"><span id="iqVal">0</span><small>IQ</small></div>
      <button class="round" id="shopBtn" data-i18n-label="a11y.shop" data-icon="shop"></button>
    </div>
    <div class="fullBar" id="fullBar"><button class="round" id="fullExit" data-i18n-label="a11y.fullExit" data-icon="shrink"></button></div>
    <div class="fullTimer" id="fullTimer" hidden>
      <div class="fullRing" id="fullRing">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="fullGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="gStart" /><stop offset="1" class="gEnd" /></linearGradient></defs>
          <circle cx="32" cy="32" r="28" class="frTrack" />
          <circle cx="32" cy="32" r="28" class="frArc" id="fullArc" stroke-dasharray="175.93" stroke-dashoffset="175.93" />
        </svg>
        <span class="frTime" id="fullTime"></span>
      </div>
      <div class="fullCtl" id="fullCtl">
        <button class="round play" id="fullPlay"></button>
        <button class="round" id="fullStop" data-i18n-label="btn.stop" data-icon="stop"></button>
      </div>
    </div>
    <div class="visitPill" id="visitBar" hidden><span id="visitPic"></span><span id="visitText"></span><span class="visitTimer" id="visitTimer" hidden></span><button class="visitBack" id="visitBack" data-i18n-label="visit.back"><span data-icon="back"></span><span data-i18n="visit.backShort"></span></button></div>
    <div class="replayBar" id="replayBar" hidden>
      <span class="rpIcon" data-icon="film"></span>
      <div class="rpMain"><span id="replayText"></span><span class="rpTrack"><span class="rpFill" id="replayFill"></span></span></div>
      <button class="rpStop" id="replayStop" data-i18n-label="replay.stop" data-icon="stop"></button>
    </div>
    <button class="buildChip" id="buildBtn" hidden><span data-icon="hammer"></span><span id="buildCount"></span></button>
    <div class="sheetShade" id="sheetShade"></div>
    <div class="toasts" id="toasts"></div>
    <div class="hint" data-i18n="hint"></div>
    <div class="preview">
      <label><input type="checkbox" id="pvOn"> <span data-i18n="preview.label"></span></label>
      <input type="range" id="pvRange" min="0" max="80" step="0.5" value="10" disabled>
      <span id="pvVal"></span>
    </div>
  </main>
</div>

<div class="modal" id="doneModal">
  <div class="card center">
    <div class="big" data-icon="check"></div>
    <h2 data-i18n="done.title"></h2>
    <p id="doneText"></p>
    <button class="btn" id="doneOk" data-i18n="done.ok"></button>
  </div>
</div>

<div class="modal sheet" id="logModal">
  <div class="card">
    <div class="sheetHead">
      <h2 class="ttl"><span data-icon="calendar"></span><span data-i18n="log.title"></span></h2>
      <button class="round" data-close data-i18n-label="a11y.close" data-icon="close"></button>
    </div>
    <div class="sum">
      <div class="stat"><small data-i18n="stats.total"></small><b id="aTotal"></b></div>
      <div class="stat"><small data-i18n="stats.streak"></small><b id="aStreak"></b></div>
      <div class="stat"><small data-i18n="stats.buildings"></small><b id="aBuild"></b></div>
    </div>
    <div class="tabs" id="rangeTabs"></div>
    <div class="sum">
      <div class="stat"><small data-i18n="log.total"></small><b id="lTotal"></b></div>
      <div class="stat"><small data-i18n="log.avg"></small><b id="lAvg"></b></div>
      <div class="stat"><small data-i18n="log.best"></small><b id="lBest" class="small"></b></div>
    </div>
    <div class="chart" id="chart"></div>
    <div class="xlab" id="xlab"></div>
    <h3 data-i18n="log.daily"></h3>
    <div id="dayList"></div>
  </div>
</div>

<div class="modal sheet" id="buildModal">
  <div class="card">
    <div class="sheetHead">
      <h2 class="ttl"><span data-icon="hammer"></span><span data-i18n="build.title"></span></h2>
      <button class="round" data-close data-i18n-label="a11y.close" data-icon="close"></button>
    </div>
    <p class="fine" data-i18n="build.hint"></p>
    <div class="buildCards" id="buildCards"></div>
    <p class="fine center"><span id="buildLeft"></span> <button class="linkbtn" id="buildAuto"><span data-icon="dice"></span><span data-i18n="build.auto"></span></button></p>
  </div>
</div>

<div class="modal sheet" id="badgesModal">
  <div class="card">
    <div class="sheetHead">
      <h2 class="ttl"><span data-icon="trophy"></span><span id="badgesTitle"></span></h2>
      <button class="round" data-close data-i18n-label="a11y.close" data-icon="close"></button>
    </div>
    <div class="badgeGrid" id="badgesBody"></div>
  </div>
</div>

<div class="modal sheet" id="shopModal">
  <div class="card">
    <div class="sheetHead">
      <h2 class="ttl"><span data-icon="shop"></span><span data-i18n="shop.title"></span></h2>
      <span class="shopIQ" id="shopIQ"></span>
      <button class="round" data-close data-i18n-label="a11y.close" data-icon="close"></button>
    </div>
    <div class="tabs seg" id="shopTabs"></div>
    <div id="shopBody"></div>
  </div>
</div>

<div class="modal" id="attackModal">
  <div class="card attackCard">
    <h2 id="attackTitle"></h2>
    <div id="attackBody"></div>
  </div>
</div>

<div class="modal sheet" id="accountModal">
  <div class="card">
    <div class="sheetHead">
      <h2 class="ttl"><span data-icon="user"></span><span id="accTitle"></span></h2>
      <button class="round" data-close data-i18n-label="a11y.close" data-icon="close"></button>
    </div>
    <div id="accBody"></div>
    <section class="friendsCard" id="friendsCard" hidden>
      <div class="row"><b class="ttl"><span data-icon="friends"></span><span data-i18n="friends.title"></span></b><span class="count" id="friendCount"></span></div>
      <div id="friendsBody"></div>
    </section>
  </div>
</div>

<div class="modal sheet" id="settingsModal">
  <div class="card">
    <div class="sheetHead">
      <h2 class="ttl"><span data-icon="settings"></span><span data-i18n="settings.title"></span></h2>
      <button class="round" data-close data-i18n-label="a11y.close" data-icon="close"></button>
    </div>
    <div class="setRow"><span data-i18n="settings.language"></span><div class="tabs" id="langTabs"></div></div>
    <div class="setRow"><span data-i18n="settings.theme"></span><div class="tabs" id="themeTabs"></div></div>
    <div class="setRow"><span data-i18n="settings.goal"></span><div class="tabs" id="goalTabs"></div></div>
    <label class="setRow"><span data-i18n="settings.notify"></span><input type="checkbox" class="switch" data-setting="notify"></label>
    <label class="setRow"><span data-i18n="settings.ongoing"></span><input type="checkbox" class="switch" data-setting="ongoing"></label>
    <label class="setRow"><span><span data-i18n="settings.peaceful"></span><small class="setNote" data-i18n="settings.peacefulNote"></small></span><input type="checkbox" class="switch" id="peacefulSwitch"></label>
    <label class="setRow"><span data-i18n="settings.sound"></span><input type="checkbox" class="switch" data-setting="sound"></label>
    <label class="setRow"><span data-i18n="settings.haptics"></span><input type="checkbox" class="switch" data-setting="haptics"></label>
    <label class="setRow"><span data-i18n="settings.keepAwake"></span><input type="checkbox" class="switch" data-setting="keepAwake"></label>
    <div class="save" id="version"></div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
