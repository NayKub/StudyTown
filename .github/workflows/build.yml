name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  rules:
    name: firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Test security rules in the Firestore emulator
        run: npm run test:rules

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    needs: web
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the iOS simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  desktop:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win, artifact: desktop-windows, files: 'desktop/release/*.exe' }
          - { os: macos-latest, target: mac, artifact: desktop-mac, files: 'desktop/release/*.dmg' }
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no paid signing certificate yet: Mac builds are ad-hoc signed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - name: Build the ${{ matrix.target }} installer
        run: npm run dist:${{ matrix.target }} -- --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # When main has a version (package.json) that isn't on the Releases page yet, publish it there
  # with the Android APK, Windows installer and Mac disk image. Bumping the version = a release.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Is this version new?
        id: version
        run: |
          v=$(node -p "require('./package.json').version")
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v already exists, nothing to publish"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'true'
        with: { path: artifacts }
      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        run: |
          v="${{ steps.version.outputs.v }}"
          mkdir out
          cp artifacts/android-debug-apk/app-debug.apk "out/MyLittleTown-$v-android.apk"
          cp artifacts/desktop-windows/*.exe out/
          cp artifacts/desktop-mac/*.dmg out/
          ls -la out
          gh release create "v$v" out/* --target "$GITHUB_SHA" --title "My Little Town $v" --notes-file .github/release-notes.md
